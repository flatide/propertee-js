<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProperTee - Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        /* Header */
        .top-bar {
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .top-bar h1 {
            font-size: 1.2em;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .top-bar h1 span {
            color: #8b9cf7;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .github-link {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.85em;
            transition: color 0.2s;
        }

        .github-link:hover {
            color: #fff;
        }

        /* Toolbar */
        .toolbar {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-run {
            background: #4f46e5;
            color: #fff;
        }

        .btn-run:hover {
            background: #4338ca;
        }

        .btn-run:active {
            background: #3730a3;
        }

        .example-select {
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
            background: #fff;
            outline: none;
            transition: border-color 0.15s;
        }

        .example-select:hover,
        .example-select:focus {
            border-color: #4f46e5;
        }

        .btn-restore {
            background: #f3f4f6;
            color: #6b7280;
        }

        .btn-restore:hover {
            background: #e5e7eb;
            color: #374151;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: #e0e0e0;
            margin: 0 4px;
        }

        /* Main layout */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Right column */
        .right-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e2e;
        }

        /* Section labels */
        .section-label {
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 10px 16px 6px;
            color: #9ca3af;
            flex-shrink: 0;
        }

        .right-col .section-label {
            color: #6b7280;
            background: #1e1e2e;
        }

        /* Output */
        .output-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid #313244;
            min-height: 100px;
        }

        .output-header {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #181825;
            padding: 6px 16px 4px;
            flex-shrink: 0;
        }

        .output-header .section-label {
            padding: 0;
        }

        .btn-clear-output {
            background: none;
            border: none;
            color: #6c7086;
            font-size: 0.7em;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .btn-clear-output:hover {
            color: #cdd6f4;
            background: rgba(205, 214, 244, 0.1);
        }

        #output {
            flex: 1;
            padding: 8px 16px;
            font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            overflow: auto;
            color: #cdd6f4;
            background: #181825;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Editor wrapper */
        .editor-wrapper {
            flex: 2;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .line-numbers {
            width: 48px;
            background: #181825;
            color: #6c7086;
            font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.7;
            padding: 8px 8px 16px 0;
            text-align: right;
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
            border-right: 1px solid #313244;
        }

        .line-numbers span {
            display: block;
        }

        .line-numbers span.line-error {
            color: #f38ba8;
            background: rgba(243, 139, 168, 0.12);
            font-weight: 600;
        }

        /* Editor highlight overlay */
        .editor-highlight {
            position: absolute;
            top: 0;
            left: 48px;
            right: 0;
            bottom: 0;
            background: #1e1e2e;
            overflow: hidden;
            pointer-events: none;
        }

        .editor-highlight-inner {
            position: relative;
        }

        .error-line-highlight {
            position: absolute;
            left: 0;
            right: 0;
            background: rgba(243, 139, 168, 0.15);
        }

        /* Script editor */
        #script {
            flex: 1;
            width: 100%;
            border: none;
            padding: 8px 12px 16px;
            font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.7;
            resize: none;
            background: transparent;
            color: #cdd6f4;
            outline: none;
            tab-size: 4;
            -moz-tab-size: 4;
            white-space: pre;
            word-wrap: normal;
            overflow-wrap: normal;
            position: relative;
            z-index: 1;
        }

        #script::placeholder {
            color: #585b70;
        }

        #script::selection {
            background: #45475a;
        }

        /* Reference bar */
        .reference-bar {
            background: #181825;
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
            border-bottom: 1px solid #313244;
            max-height: 80px;
            overflow-y: auto;
        }

        .ref-chip {
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Menlo', monospace;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            background: none;
        }

        .ref-chip.kw {
            color: #cba6f7;
        }

        .ref-chip.kw:hover {
            background: rgba(203, 166, 247, 0.15);
        }

        .ref-chip.fn {
            color: #89b4fa;
        }

        .ref-chip.fn:hover {
            background: rgba(137, 180, 250, 0.15);
        }

    </style>
</head>
<body>
    <div class="top-bar">
        <h1><span>ProperTee</span> Playground</h1>
        <div class="top-bar-right">
            <a href="https://github.com/flatide/ProperTee" class="github-link" target="_blank">GitHub</a>
        </div>
    </div>

                <button class="ref-chip kw" onclick="insertText('then')">then</button>

                <button class="ref-chip kw" onclick="insertText('do')">do</button>

                <button class="ref-chip kw" onclick="insertText('return')">return</button>

                <button class="ref-chip fn" onclick="insertText('CHARS()')">CHARS</button>

                <button class="ref-chip fn" onclick="insertText('TIME()')">TIME</button>
            </div>
            <div class="editor-wrapper">
                <div class="line-numbers" id="lineNumbers">1</div>
                <div class="editor-highlight" id="editorHighlight"><div class="editor-highlight-inner" id="editorHighlightInner"></div></div>
                <textarea id="script" placeholder="// Enter ProperTee code..." spellcheck="false">// 01 - Hello World
// The simplest ProperTee program. PRINT is a built-in function.

PRINT("Hello, World!")</textarea>
            </div>
            <div class="output-section">
                <div class="output-header">
                    <div class="section-label">Output</div>
                    <button class="btn-clear-output" onclick="clearOutput()">Clear</button>
                </div>
                <pre id="output"></pre>

        </div>
    </div>

    <script src="dist/propertee-bundle.js"></script>

    <script>
        class ErrorListener extends antlr4.error.ErrorListener {
            constructor() {
                super();
                this.errors = [];
                this.lines = [];
            }
            syntaxError(recognizer, offendingSymbol, line, column, msg, err) {
                this.errors.push(`Line ${line}:${column} - ${msg}`);
                this.lines.push(line);
            }
        }

        let errorLineSet = new Set();

        function updateLineNumbers() {
            const script = document.getElementById('script');
            const lineNumbers = document.getElementById('lineNumbers');
            const lineCount = script.value.split('\n').length;
            let html = '';
            for (let i = 1; i <= lineCount; i++) {
                if (errorLineSet.has(i)) {
                    html += '<span class="line-error">' + i + '</span>';
                } else {
                    html += '<span>' + i + '</span>';
                }
            }
            lineNumbers.innerHTML = html;
        }

        function updateEditorHighlight() {
            const inner = document.getElementById('editorHighlightInner');
            const highlight = document.getElementById('editorHighlight');
            const script = document.getElementById('script');
            if (errorLineSet.size === 0) {
                inner.innerHTML = '';
                inner.style.height = '0';
                return;
            }
            const style = getComputedStyle(script);
            const lineHeight = parseFloat(style.lineHeight);
            const paddingTop = parseFloat(style.paddingTop);
            inner.style.height = script.scrollHeight + 'px';
            let html = '';
            errorLineSet.forEach(function(line) {
                const top = paddingTop + (line - 1) * lineHeight;
                html += '<div class="error-line-highlight" style="top:' + top + 'px;height:' + lineHeight + 'px"></div>';
            });
            inner.innerHTML = html;
            highlight.scrollTop = script.scrollTop;
        }

        function highlightErrorLines(lines) {
            errorLineSet = new Set(lines);
            updateLineNumbers();
            updateEditorHighlight();
            if (lines.length > 0) {
                const script = document.getElementById('script');
                const lineHeight = parseFloat(getComputedStyle(script).lineHeight);
                const targetScroll = (lines[0] - 1) * lineHeight - script.clientHeight / 3;
                script.scrollTop = Math.max(0, targetScroll);
                document.getElementById('lineNumbers').scrollTop = script.scrollTop;
                document.getElementById('editorHighlight').scrollTop = script.scrollTop;
            }
        }

        function clearErrorHighlights() {
            if (errorLineSet.size > 0) {
                errorLineSet = new Set();
                updateLineNumbers();
                updateEditorHighlight();
            }
        }

        function parseErrorLines(message) {
            const lines = [];
            const re = /(?:at |^)line (\d+):/gim;
            let match;
            while ((match = re.exec(message)) !== null) {
                lines.push(parseInt(match[1], 10));
            }
            return lines;
        }

        function insertText(text) {
            const scriptArea = document.getElementById('script');
            const start = scriptArea.selectionStart;
            const end = scriptArea.selectionEnd;
            const value = scriptArea.value;
            scriptArea.value = value.substring(0, start) + text + value.substring(end);
            if (text.includes('()')) {
                scriptArea.selectionStart = scriptArea.selectionEnd = start + text.length - 1;
            } else {
                scriptArea.selectionStart = scriptArea.selectionEnd = start + text.length;
            }
            scriptArea.focus();
            updateLineNumbers();
        }

        const examples = {
            '01_hello': `// 01 - Hello World
// The simplest ProperTee program. PRINT is a built-in function.

PRINT("Hello, World!")`,

            '02_variables': `// 02 - Variables and Types
// ProperTee has numbers, strings, booleans, arrays, and objects.

// Numbers
x = 10
y = 3.14

// Strings
name = "ProperTee"

// Booleans
active = true
done = false

// Arrays (use 1-based indexing)
colors = ["red", "green", "blue"]
PRINT("First color:", colors.1)
PRINT("Third color:", colors.3)

// Objects
person = {
    name: "Alice",
    age: 30,
    active: true
}
PRINT("Name:", person.name)
PRINT("Age:", person.age)

// Nested structures
team = {
    lead: { name: "Bob", role: "manager" },
    members: ["Alice", "Charlie", "Dana"]
}
PRINT("Lead:", team.lead.name)
PRINT("Second member:", team.members.2)`,

            '03_arithmetic': `// 03 - Arithmetic and Expressions
// Operators: +  -  *  /  %
// Note: + also concatenates strings, but both sides must be the same type.

a = 10
b = 3

PRINT("a + b =", a + b)
PRINT("a - b =", a - b)
PRINT("a * b =", a * b)
PRINT("a / b =", a / b)
PRINT("a % b =", a % b)

// Unary minus
PRINT("Negative a:", -a)

// String concatenation
greeting = "Hello" + " " + "World"
PRINT(greeting)

// To mix numbers and strings, convert first
PRINT("Score: " + TO_STRING(100))

// Built-in math functions
PRINT("ABS(-5):", ABS(-5))
PRINT("FLOOR(3.7):", FLOOR(3.7))
PRINT("CEIL(3.2):", CEIL(3.2))
PRINT("ROUND(3.5):", ROUND(3.5))
PRINT("MIN(4, 2, 7):", MIN(4, 2, 7))
PRINT("MAX(4, 2, 7):", MAX(4, 2, 7))
PRINT("SUM(1, 2, 3, 4):", SUM(1, 2, 3, 4))`,

            '04_comparisons': `// 04 - Comparisons and Logic
// Comparison: ==  !=  >  <  >=  <=
// Logic: and  or  not  (operands must be booleans -- no truthy/falsy coercion)

x = 10
y = 20

PRINT("x == 10:", x == 10)
PRINT("x != y:", x != y)
PRINT("x > y:", x > y)
PRINT("x < y:", x < y)
PRINT("x >= 10:", x >= 10)
PRINT("y <= 15:", y <= 15)

// Logical operators (both sides must be booleans)
a = true
b = false

PRINT("a and b:", a and b)
PRINT("a or b:", a or b)
PRINT("not a:", not a)

// Combining comparisons
age = 25
PRINT("Is adult (18-65):", age >= 18 and age <= 65)`,

            '05_if_else': `// 05 - If / Else
// Syntax: if <condition> then <body> [else <body>] end

score = 85

if score >= 90 then
    PRINT("Grade: A")
else
    if score >= 80 then
        PRINT("Grade: B")
    else
        if score >= 70 then
            PRINT("Grade: C")
        else
            PRINT("Grade: F")
        end
    end
end

// Simple if (no else)
logged_in = true
if logged_in then
    PRINT("Welcome back!")
end`,

            '06_loops': `// 06 - Loops
// ProperTee has three loop forms: condition, value-in, and key-value-in.

// --- Condition loop (like while) ---
count = 0
loop count < 5 do
    PRINT("count =", count)
    count = count + 1
end

PRINT("---")

// --- Value loop (iterate over array) ---
fruits = ["apple", "banana", "cherry"]
loop fruit in fruits do
    PRINT("Fruit:", fruit)
end

PRINT("---")

// --- Key-value loop (iterate with index or key) ---
// On arrays: key is the 1-based index
scores = [95, 82, 71]
loop i, score in scores do
    PRINT("Student " + TO_STRING(i) + ": " + TO_STRING(score))
end

PRINT("---")

// On objects: key is the property name
config = { host: "localhost", port: "8080", debug: "true" }
loop key, val in config do
    PRINT(key + " = " + val)
end

PRINT("---")

// --- break and continue ---
nums = [1, 2, 3, 4, 5, 6, 7, 8]
loop n in nums do
    if n == 3 then
        continue       // skip 3
    end
    if n == 6 then
        break          // stop at 6
    end
    PRINT(n)
end`,

            '07_functions': `// 07 - Functions
// Syntax: function <name>(<params>) do <body> end

// Basic function
function greet(name) do
    return "Hello, " + name + "!"
end

PRINT(greet("World"))

// Function with multiple parameters
function add(a, b) do
    return a + b
end

PRINT("3 + 4 =", add(3, 4))

// Functions can use local variables
function factorial(n) do
    result = 1
    i = 1
    loop i <= n infinite do
        result = result * i
        i = i + 1
    end
    return result
end

PRINT("5! =", factorial(5))

// Recursive function
function fib(n) do
    if n <= 1 then
        return n
    end
    return fib(n - 1) + fib(n - 2)
end

PRINT("fib(10) =", fib(10))

// Function without return (returns empty object {})
function say(msg) do
    PRINT(">> " + msg)
end

result = say("no return value")
PRINT("result:", result)`,

            '08_strings': `// 08 - String Functions
// Built-in functions for working with strings.

text = "  Hello, ProperTee World!  "

// Length
PRINT("Length:", LEN(text))

// Trim whitespace
trimmed = TRIM(text)
PRINT("Trimmed:", trimmed)

// Case conversion
PRINT("Upper:", UPPERCASE(trimmed))
PRINT("Lower:", LOWERCASE(trimmed))

// Substring (1-based start, optional length)
PRINT("First 5 chars:", SUBSTRING(trimmed, 1, 5))
PRINT("From position 8:", SUBSTRING(trimmed, 8))

// Split and Join
csv = "apple,banana,cherry,date"
parts = SPLIT(csv, ",")
PRINT("Split:", parts)
PRINT("Second item:", parts.2)

rejoined = JOIN(parts, " | ")
PRINT("Joined:", rejoined)

// Convert string to character array
chars = CHARS("ABC")
PRINT("Chars:", chars)

// Type conversion
num = TO_NUMBER("42")
PRINT("As number:", num + 8)

str = TO_STRING(3.14)
PRINT("As string:", str + " is pi")`,

            '09_arrays': `// 09 - Array Functions
// Arrays use 1-based indexing.

items = [10, 20, 30, 40, 50]
PRINT("Array:", items)
PRINT("Length:", LEN(items))

// Access (1-based)
PRINT("First:", items.1)
PRINT("Third:", items.3)

// PUSH - returns a new array with item added
items = PUSH(items, 60)
PRINT("After PUSH(60):", items)

// POP - returns a new array with last item removed
items = POP(items)
PRINT("After POP:", items)

// SLICE (1-based start, exclusive end)
middle = SLICE(items, 2, 4)
PRINT("Slice(2,4):", middle)

tail = SLICE(items, 3)
PRINT("Slice(3):", tail)

// CONCAT - merge arrays
a = [1, 2, 3]
b = [4, 5, 6]
c = CONCAT(a, b)
PRINT("Concat:", c)

// Modify elements
items.2 = 999
PRINT("After items.2 = 999:", items)

// SUM on arrays (pass individual elements via loop)
total = 0
loop v in items do
    total = total + v
end
PRINT("Total:", total)`,

            '10_objects': `// 10 - Objects and Access Patterns
// Objects are key-value maps with several access styles.

person = {
    name: "Alice",
    age: 30,
    city: "Seoul"
}

            '11_threads_basic': `// 11 - Threads (Basic)
// Functions run concurrently inside a "multi" block using "thread".
// They are pure: can read globals (snapshot), cannot write globals.

// Define functions normally with the "function" keyword
function worker(name, steps) do
    i = 0
    loop i < steps infinite do
        PRINT(name + " step " + TO_STRING(i + 1))
        i = i + 1
    end
    return name + " done"
end

// Run functions in parallel with "multi result do ... end"
// Use "thread key: funcCall()" to name each result in the collection
multi result do
    thread resultA: worker("Alpha", 3)
    thread resultB: worker("Beta", 3)
end

// Results are available after the multi block
// Each entry is {status: "done", ok: true, value: <return value>}
PRINT("---")
PRINT("Alpha status:", result.resultA.status)
PRINT("Alpha returned:", result.resultA.value)
PRINT("Beta returned:", result.resultB.value)`,

            '12_threads_sleep': `// 12 - Threads with SLEEP
// SLEEP(ms) pauses only the calling thread.
// Other threads keep running while one sleeps.

function fast_worker(name) do
    PRINT(name + ": start")
    PRINT(name + ": working...")
    PRINT(name + ": done!")
    return "fast"
end

function slow_worker(name, ms) do
    PRINT(name + ": start, sleeping " + TO_STRING(ms) + "ms")
    SLEEP(ms)
    PRINT(name + ": woke up, done!")
    return "slow"
end

multi result do
    thread r1: slow_worker("Sleepy", 200)
    thread r2: fast_worker("Speedy")
end

// Speedy finishes while Sleepy is asleep
PRINT("---")
PRINT("Sleepy:", result.r1.value)
PRINT("Speedy:", result.r2.value)`,

    loop i < target infinite do

            '16_comments': `// 16 - Comments
// ProperTee supports single-line and block comments.

// This is a single-line comment

/* This is a
   block comment
   spanning multiple lines */

x = 42 // inline comment after code

        };

        let currentExample = '01_hello';
        const scriptCache = {};

        function loadExample(name) {
            if (!name) return;
            const scriptEl = document.getElementById('script');
            if (currentExample) {
                scriptCache[currentExample] = scriptEl.value;
            }
            const content = scriptCache[name] !== undefined ? scriptCache[name] : examples[name];
            if (content !== undefined) {
                scriptEl.value = content;
                currentExample = name;
                clearErrorHighlights();
                updateLineNumbers();
            }
        }

        function restoreExample() {
            if (!currentExample || !examples[currentExample]) return;
            delete scriptCache[currentExample];
            document.getElementById('script').value = examples[currentExample];
            clearErrorHighlights();
            updateLineNumbers();
        }

        async function run() {
            const output = document.getElementById('output');
            const runButton = document.getElementById('runButton');
            const scriptText = document.getElementById('script').value;

            clearErrorHighlights();
            runButton.disabled = true;
            runButton.textContent = 'Running...';
            appendOutput('Starting...\n', '#6c7086');

            try {
                const properties = {};

                const chars = new antlr4.InputStream(scriptText);
                const lexer = new ProperTeeLexer(chars);
                const lexerErrors = new ErrorListener();
                lexer.removeErrorListeners();
                lexer.addErrorListener(lexerErrors);

                const tokens = new antlr4.CommonTokenStream(lexer);
                const parser = new ProperTeeParser(tokens);
                const parserErrors = new ErrorListener();
                parser.removeErrorListeners();
                parser.addErrorListener(parserErrors);

                const tree = parser.root();

                if (lexerErrors.errors.length > 0) {
                    appendOutput('Lexer Error:\n' + lexerErrors.errors.join('\n') + '\n', '#f38ba8');
                    highlightErrorLines(lexerErrors.lines);
                    return;
                }
                if (parserErrors.errors.length > 0) {
                    appendOutput('Parser Error:\n' + parserErrors.errors.join('\n') + '\n', '#f38ba8');
                    highlightErrorLines(parserErrors.lines);
                    return;
                }

                const ioStreams = {
                    stdout: (...args) => {
                        appendOutput(args.join(' ') + '\n');
                    },
                    stderr: (...args) => {
                        appendOutput('[ERROR] ' + args.join(' ') + '\n', '#f38ba8');
                    }
                };

                const options = {
                    maxIterations: 1000,
                    iterationLimitBehavior: 'error'
                };

                const visitor = new ProperTeeCustomVisitor(properties, {}, ioStreams, options);
                const scheduler = new Scheduler(visitor);
                const mainGenerator = visitor.visitRoot(tree);
                const result = await scheduler.run(mainGenerator);

                appendOutput('Finished with result: ' + JSON.stringify(result, null, 2) + '\n', '#a6e3a1');

            } catch (e) {
                appendOutput('Runtime Error: ' + e.message + '\n', '#f38ba8');
                const errLines = parseErrorLines(e.message);
                if (errLines.length > 0) highlightErrorLines(errLines);
                console.error(e);
            } finally {
                runButton.disabled = false;
                runButton.textContent = 'Run';
                output.scrollTop = output.scrollHeight;
            }
        }

        function appendOutput(text, color) {
            const output = document.getElementById('output');
            if (color) {
                const span = document.createElement('span');
                span.style.color = color;
                span.textContent = text;
                output.appendChild(span);
            } else {
                output.appendChild(document.createTextNode(text));
            }
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('output').textContent = '';
        }

        // Code editor features
        function initCodeEditor() {
            const textareas = document.querySelectorAll('textarea');
            textareas.forEach(textarea => {
                textarea.addEventListener('keydown', function(e) {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        const value = this.value;
                        if (e.shiftKey) {
                            const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                            const line = value.substring(lineStart, end);
                            if (line.startsWith('    ')) {
                                this.value = value.substring(0, lineStart) + line.substring(4) + value.substring(end);
                                this.selectionStart = Math.max(lineStart, start - 4);
                                this.selectionEnd = end - 4;
                            }
                        } else {
                            this.value = value.substring(0, start) + '    ' + value.substring(end);
                            this.selectionStart = this.selectionEnd = start + 4;
                        }
                        updateLineNumbers();
                    }

                    if (e.key === 'Enter') {
                        const start = this.selectionStart;
                        const value = this.value;
                        const currentLine = value.substring(0, start).split('\n').pop();
                        const indent = currentLine.match(/^\s*/)[0];
                        const trimmedLine = currentLine.trim();
                        const indentKeywords = ['then', 'do', 'else'];
                        const shouldIndent = indentKeywords.some(kw => trimmedLine.endsWith(kw));
                        if (shouldIndent || indent.length > 0) {
                            e.preventDefault();
                            const newIndent = shouldIndent ? indent + '    ' : indent;
                            const ins = '\n' + newIndent;
                            this.value = value.substring(0, start) + ins + value.substring(start);
                            this.selectionStart = this.selectionEnd = start + ins.length;
                            updateLineNumbers();
                        }
                    }

                    if (e.key === 'd' && this.value.substring(this.selectionStart - 2, this.selectionStart) === 'en') {
                        setTimeout(() => {
                            const start = this.selectionStart;
                            const value = this.value;
                            const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                            const line = value.substring(lineStart, start);
                            if (line.trim() === 'end' && line.startsWith('    ')) {
                                this.value = value.substring(0, lineStart) + line.substring(4) + value.substring(start);
                                this.selectionStart = this.selectionEnd = start - 4;
                                updateLineNumbers();
                            }
                        }, 0);
                    }

                    if (e.key === '/' && (e.ctrlKey || e.metaKey)) {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        const value = this.value;
                        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                        const lineEnd = value.indexOf('\n', end);
                        const line = value.substring(lineStart, lineEnd === -1 ? value.length : lineEnd);
                        if (line.trim().startsWith('//')) {
                            const newLine = line.replace(/^(\s*)\/\/\s?/, '$1');
                            this.value = value.substring(0, lineStart) + newLine + value.substring(lineEnd === -1 ? value.length : lineEnd);
                            this.selectionStart = start;
                            this.selectionEnd = end - (line.length - newLine.length);
                        } else {
                            const ind = line.match(/^\s*/)[0];
                            const newLine = ind + '// ' + line.substring(ind.length);
                            this.value = value.substring(0, lineStart) + newLine + value.substring(lineEnd === -1 ? value.length : lineEnd);
                            this.selectionStart = start + 3;
                            this.selectionEnd = end + 3;
                        }
                    }
                });
            });
        }

        window.addEventListener('load', () => {
            initCodeEditor();
            updateLineNumbers();

            const script = document.getElementById('script');
            const lineNumbers = document.getElementById('lineNumbers');
            script.addEventListener('input', () => {
                clearErrorHighlights();
                updateLineNumbers();
            });
            const editorHighlight = document.getElementById('editorHighlight');
            script.addEventListener('scroll', () => {
                lineNumbers.scrollTop = script.scrollTop;
                editorHighlight.scrollTop = script.scrollTop;
            });

            setTimeout(() => run(), 500);
        });
    </script>
