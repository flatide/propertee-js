<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProperTee - Scratch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .button-group {
            margin: 15px 0;
        }
        .btn {
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-danger {
            background-color: #f44336;
            color: white;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #output {
            min-height: 300px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            background-color: #f9f9f9;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .demo-btn {
            padding: 6px 12px;
            margin: 3px;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            background: #fff;
        }
        .demo-btn:hover {
            background: #e8e8e8;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>ProperTee - Generator-Based Cooperative Scheduler</h1>

    <h3>Properties (JSON):</h3>
    <textarea id="properties" rows="3" cols="50">{"user": {"name": "Test", "score": 100}}</textarea>

    <h3>Demo Scripts:</h3>
    <div>
        <button class="demo-btn" onclick="loadDemo('basic')">Basic (No Threads)</button>
        <button class="demo-btn" onclick="loadDemo('interleave')">Interleaved PRINT</button>
        <button class="demo-btn" onclick="loadDemo('sleep')">SLEEP Interleaving</button>
        <button class="demo-btn" onclick="loadDemo('monitor')">MONITOR</button>
        <button class="demo-btn" onclick="loadDemo('results')">Thread Results</button>
    </div>

    <h3>Script:</h3>
    <textarea id="script" rows="20" cols="50">/* Interleaved PRINT Demo */

function worker(name, count) do
    i = 0
    loop i < count infinite do
        PRINT(name + ": step " + TO_STRING(i + 1))
        i = i + 1
    end
    return count
end

multi result do
    thread r1: worker("Alpha", 4)
    thread r2: worker("Beta", 4)
    thread r3: worker("Gamma", 4)
end

PRINT("=== All threads done ===")
PRINT("Alpha result:", result.r1.value)
PRINT("Beta result:", result.r2.value)
PRINT("Gamma result:", result.r3.value)
</textarea>

    <div class="button-group">
        <button class="btn btn-primary" id="runButton" onclick="run()">Run</button>
        <button class="btn btn-danger" onclick="clearOutput()">Clear Output</button>
    </div>

    <h3>Output:</h3>
    <div id="output"></div>

    <!-- ProperTee bundle -->
    <script src="./browser/propertee-bundle.js"></script>

    <script>
        // Demo scripts
        const demos = {
            basic: `/* Basic script - no threads */
x = 10
y = 20
PRINT("x + y =", x + y)

function greet(name) do
    return "Hello, " + name + "!"
end

PRINT(greet("World"))

items = [1, 2, 3, 4, 5]
total = 0
loop v in items do
    total = total + v
end
PRINT("Sum:", total)`,

            interleave: `/* Interleaved PRINT Demo */
/* Threads yield after every statement, so PRINTs should interleave */

function worker(name, count) do
    i = 0
    loop i < count infinite do
        PRINT(name + ": step " + TO_STRING(i + 1))
        i = i + 1
    end
    return count
end

multi result do
    thread r1: worker("Alpha", 4)
    thread r2: worker("Beta", 4)
    thread r3: worker("Gamma", 4)
end

PRINT("=== All threads done ===")
PRINT("Alpha result:", result.r1.value)
PRINT("Beta result:", result.r2.value)
PRINT("Gamma result:", result.r3.value)`,

            sleep: `/* SLEEP Interleaving Demo */
/* Sleeping threads don't block others */

function fast(name) do
    PRINT(name + ": starting fast work")
    PRINT(name + ": step 1")
    PRINT(name + ": step 2")
    PRINT(name + ": step 3")
    PRINT(name + ": done!")
    return "fast-done"
end

function sleepy(name, ms) do
    PRINT(name + ": starting, will sleep " + TO_STRING(ms) + "ms")
    SLEEP(ms)
    PRINT(name + ": woke up!")
    return "slept-" + TO_STRING(ms)
end

multi result do
    thread r1: sleepy("Sleeper", 100)
    thread r2: fast("Worker")
end

PRINT("=== Results ===")
PRINT("Sleeper:", result.r1.value)
PRINT("Worker:", result.r2.value)`,

            monitor: `/* MONITOR Demo */
/* Monitor runs periodically between scheduler ticks */

function counter(name, target) do
    i = 0
    loop i < target infinite do
        i = i + 1
    end
    PRINT(name + " finished counting to " + TO_STRING(target))
    return i
end

multi result do
    thread rA: counter("A", 10)
    thread rB: counter("B", 8)
monitor 50
    PRINT("[Monitor tick]")
end

PRINT("=== Results ===")
PRINT("A counted:", result.rA.value)
PRINT("B counted:", result.rB.value)`,

            results: `/* Thread Results Demo */

function calculate(n) do
    temp = n * 2
    squared = temp * temp
    res = squared + n
    PRINT("Thread", n, "calculated:", res)
    return res
end

function buildObject(id) do
    obj = {
        id: id,
        value: id * 100,
        status: "complete"
    }
    PRINT("Thread", id, "built object")
    return obj
end

multi result do
    thread r1: calculate(5)
    thread r2: calculate(3)
    thread r3: buildObject(99)
end

PRINT("=== Results ===")
PRINT("r1 (calculate 5):", result.r1.value)
PRINT("r2 (calculate 3):", result.r2.value)
PRINT("r3 (buildObject):", result.r3.value)
PRINT("r3.id:", result.r3.value.id)
PRINT("r3.value:", result.r3.value.value)
PRINT("r3.status:", result.r3.value.status)`
        };

        function loadDemo(name) {
            document.getElementById('script').value = demos[name];
        }

        // Error listener
        class ErrorListener extends antlr4.error.ErrorListener {
            constructor() {
                super();
                this.errors = [];
            }
            syntaxError(recognizer, offendingSymbol, line, column, msg, err) {
                this.errors.push(`Line ${line}:${column} - ${msg}`);
            }
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        async function run() {
            const output = document.getElementById('output');
            const runButton = document.getElementById('runButton');
            const propertiesText = document.getElementById('properties').value;
            const scriptText = document.getElementById('script').value;

            output.innerHTML = '';
            runButton.disabled = true;
            runButton.textContent = 'Running...';

            try {
                const properties = JSON.parse(propertiesText);

                // Parse
                const chars = new antlr4.InputStream(scriptText);
                const lexer = new ProperTeeLexer(chars);
                const lexerErrors = new ErrorListener();
                lexer.removeErrorListeners();
                lexer.addErrorListener(lexerErrors);

                const tokens = new antlr4.CommonTokenStream(lexer);
                const parser = new ProperTeeParser(tokens);
                const parserErrors = new ErrorListener();
                parser.removeErrorListeners();
                parser.addErrorListener(parserErrors);

                const tree = parser.root();

                if (lexerErrors.errors.length > 0) {
                    const errorDiv = document.createElement('div');
                    errorDiv.style.color = 'red';
                    errorDiv.textContent = 'Lexer Error:\n' + lexerErrors.errors.join('\n');
                    output.appendChild(errorDiv);
                    return;
                }
                if (parserErrors.errors.length > 0) {
                    const errorDiv = document.createElement('div');
                    errorDiv.style.color = 'red';
                    errorDiv.textContent = 'Parser Error:\n' + parserErrors.errors.join('\n');
                    output.appendChild(errorDiv);
                    return;
                }

                // IO streams
                const ioStreams = {
                    stdout: (...args) => {
                        const line = args.join(' ');
                        const div = document.createElement('div');
                        div.textContent = line;
                        output.appendChild(div);
                        output.scrollTop = output.scrollHeight;
                    },
                    stderr: (...args) => {
                        const line = '[ERROR] ' + args.join(' ');
                        const div = document.createElement('div');
                        div.style.color = 'red';
                        div.textContent = line;
                        output.appendChild(div);
                        output.scrollTop = output.scrollHeight;
                    }
                };

                const options = {
                    maxIterations: 1000,
                    iterationLimitBehavior: 'error'
                };

                // Create visitor and scheduler
                const visitor = new ProperTeeCustomVisitor(properties, {}, ioStreams, options);
                const scheduler = new Scheduler(visitor);
                const mainGenerator = visitor.visitRoot(tree);
                const result = await scheduler.run(mainGenerator);

                // Summary
                const summary = document.createElement('div');
                summary.style.marginTop = '20px';
                summary.style.borderTop = '2px solid #ccc';
                summary.style.paddingTop = '10px';
                summary.style.fontFamily = 'monospace';
                summary.style.fontSize = '12px';
                summary.innerHTML = `
                    <strong>--- Return Value ---</strong>
                    <pre style="margin: 5px 0;">${JSON.stringify(result, null, 2)}</pre>

                    <strong>--- Variables ---</strong>
                    <pre style="margin: 5px 0;">${JSON.stringify(visitor.variables, null, 2)}</pre>
                `;
                output.appendChild(summary);

            } catch (e) {
                const errorDiv = document.createElement('div');
                errorDiv.style.marginTop = '20px';
                errorDiv.style.borderTop = '2px solid red';
                errorDiv.style.paddingTop = '10px';
                errorDiv.style.color = 'red';
                errorDiv.innerHTML = `
                    <strong>--- Runtime Error ---</strong>
                    <pre style="margin: 5px 0;">${e.message}\n\n${e.stack}</pre>
                `;
                output.appendChild(errorDiv);
            } finally {
                runButton.disabled = false;
                runButton.textContent = 'Run';
            }
        }
    </script>
</body>
</html>
